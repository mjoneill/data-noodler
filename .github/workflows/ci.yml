# CI for every push and pull request.
#
#   leak-guard  refuses credentials, real reports, a project notebook, a
#               filled deployment profile and personal home folders
#               (tools/leak_guard.py),
#               after proving each rule still catches a planted example.
#   tests       the product's test suite on the pinned dependency set, on macOS.
#   tests-windows  the same suite on windows-latest (#2008).
#   audit       the OSV dependency scan of installer/constraints.txt.
#   upgrade-rehearsal  a real upgrade from an older release to this tree, in
#               a throwaway home on the runner (#2108).
#
# Actions are pinned to full commit SHAs; the tag each one was is in the
# comment beside it.

name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  leak-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          # Full history, at the commits themselves rather than the synthetic
          # merge a pull_request run checks out: the identity guard reads
          # every author and committer (#1996). Full history also fetches
          # every tag as the object it is, so the guard can read the tagger
          # of each annotated tag (#2003).
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: The guards' own controls (each rule catches a planted example)
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
          python -I -m unittest discover -s tools/tests -v
      - name: Leak guard over every tracked file
        # Runs even when a control fails. On a bad push the control that scans
        # this very tree fails first, and its refusal is buried in a test
        # traceback; this step prints the plain one, rule by rule.
        if: always()
        run: python -I tools/leak_guard.py
      - name: Identity guard over the commits this push or pull request adds, and every annotated tag
        # Only new commits: the merge commits GitHub makes on main carry the
        # merging account's email and are never re-checked. On a push to main
        # itself there is no new commit to check. Tags are not limited the
        # same way: the tagger of every annotated tag in the repository is
        # read on every run (#2003), and the pass line counts them. Exit code
        # 1 is a refusal; 2 means git could not be read and nothing was
        # verified.
        if: always()
        run: python -I tools/identity_guard.py --since origin/main

  tests:
    # macOS: the product ships to macOS and Windows, and its launchers use
    # macOS's plutil. Linux is not a supported platform.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install the pinned set (the install line from installer/constraints.txt)
        run: |
          python -m pip install --upgrade -c data-noodler/installer/constraints.txt pip
          python -m pip install -c data-noodler/installer/constraints.txt analytics-mcp==1.1.0 google-auth-oauthlib
      - name: Test suite
        working-directory: data-noodler
        run: python -m unittest discover -s tests -v

  tests-windows:
    # Windows is a supported target (#2008). Green since the fixture slice
    # (windows-latest run 44886513828), so main moves only when this passes
    # too (decision 162f80e1). The repository's ruleset for main requires it,
    # alongside tests, audit and leak-guard (added 2026-11-21). Tests that
    # exercise a POSIX-only mechanism skip on Windows by name, with the reason.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install the pinned set (the install line from installer/constraints.txt)
        run: |
          python -m pip install --upgrade -c data-noodler/installer/constraints.txt pip
          python -m pip install -c data-noodler/installer/constraints.txt analytics-mcp==1.1.0 google-auth-oauthlib
      - name: Test suite
        working-directory: data-noodler
        run: python -m unittest discover -s tests -v

  upgrade-rehearsal:
    # The one place the upgrade is run for real, downloads and all: an older
    # release is installed into a throwaway home, then this tree's upgrade.py
    # replaces it and the result is checked (data-noodler/tests/
    # dry_run_upgrade.sh). It runs here because it installs packages, which a
    # contributor's own machine should not have to do. Not yet required by
    # the ruleset for main: it is new, and it depends on the network.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          # Full history: the older release is built from an earlier commit.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Rehearse the upgrade (the last line is PASS or FAIL)
        run: bash data-noodler/tests/dry_run_upgrade.sh

  audit:
    runs-on: ubuntu-latest
    # Blocking since #1986 (2026-11-20): no advisory is accepted, so a new
    # one fails the build.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: OSV scan of the pins
        run: |
          python -m pip install pip-audit==2.10.1
          # The scan line from installer/constraints.txt's header.
          pip-audit --no-deps --disable-pip -s osv \
            -r data-noodler/installer/constraints.txt
