# Regenerate the pinned set on a clean machine, never on a maintainer's.
#
# installer/constraints.txt says a pin must come from an interpreter where
# the servers were seen working. This job is that interpreter: a fresh
# macOS runner installs the current pins with only the packages named in
# BUMPS changed, runs the full test suite against the result, captures it
# with installer/freeze_constraints.py, and scans the capture with OSV. The
# captured file is the job's artifact; a person splices its pin lines into
# constraints.txt (keeping the header) and commits that.
#
# Runs on a push to a refresh/** branch, or by hand. It never commits.

name: refresh-pins

on:
  push:
    branches: ["refresh/**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # EDIT BUMPS AND RELEASE FOR EACH REFRESH. As committed they describe the
  # last one (#1986 slice 2, 2026-11-20: analytics-mcp 0.8.0 -> 1.1.0, whose
  # requirements the existing pins already met); pushing a refresh/** branch
  # unedited just re-runs it.
  # name==version, space-separated: the only pins this run changes.
  BUMPS: >-
    analytics-mcp==1.1.0
  # Pins dropped so pip may move them with the bumps above.
  RELEASE: ""

jobs:
  refresh:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Seed constraints = current pins with the bumps applied
        run: |
          python - <<'EOF'
          import os, re
          bumps = dict(b.split("==") for b in os.environ["BUMPS"].split())
          release = set(os.environ["RELEASE"].split())
          norm = lambda n: re.sub(r"[-_.]+", "-", n).lower()
          keyed = {norm(k): (k, v) for k, v in bumps.items()}
          out = []
          for line in open("ga-mcp-dist/installer/constraints.txt"):
              line = line.strip()
              if not line or line.startswith("#") or "==" not in line:
                  continue
              name = line.split("==")[0]
              if norm(name) in {norm(r) for r in release}:
                  continue
              if norm(name) in keyed:
                  k, v = keyed.pop(norm(name))
                  out.append(f"{name}=={v}")
              else:
                  out.append(line)
          out += [f"{k}=={v}" for k, v in keyed.values()]
          open("seed.txt", "w").write("\n".join(out) + "\n")
          print(open("seed.txt").read())
          EOF
      - name: Install from the seed (the product's own install line)
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/python -m pip install --upgrade -c seed.txt pip
          /tmp/v/bin/python -m pip install -c seed.txt analytics-mcp==1.1.0 google-auth-oauthlib
      - name: Full test suite against it
        working-directory: ga-mcp-dist
        run: /tmp/v/bin/python -m unittest discover -s tests
      - name: Capture
        run: /tmp/v/bin/python ga-mcp-dist/installer/freeze_constraints.py | tee refreshed-pins.txt
      - name: OSV scan of the capture, no exceptions
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit --no-deps --disable-pip -s osv -r refreshed-pins.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: refreshed-pins
          path: |
            seed.txt
            refreshed-pins.txt
